[package]
name = "micromail"
version = "0.1.0"
edition = "2021"
description = "Lightweight outbound SMTP relay and CLI mail sender"
license = "MIT"

[lib]
name = "micromail"
path = "src/lib.rs"

[[bin]]
name = "micromail"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dirs = "5.0.1"
ed25519-dalek = { version = "3.0.0", features = ["pkcs8"] }
hickory-resolver = { version = "0.26.1", features = ["tokio"] }
mail-builder = "0.4.4"
mail-parser = "0.11.6"
mail-send = { version = "0.6.1", default-features = false, features = ["builder"] }
rpassword = "7.5.4"
rsa = "0.9.10"
rustls = "0.23.43"
rustls-pemfile = "2.2.0"
rustls-pki-types = "1.15.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "sync", "macros", "fs", "process", "signal"], default-features = false }
tokio-rustls = "0.26.4"
toml = "1.1.4"
toml_edit = "0.25.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
rand = "0.8"
rcgen = "0.14.9"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
strip = true
