name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  BIN: micromail

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-linux:
    name: Build x86_64 Linux
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          grep '^version = ' Cargo.toml

      - name: Build release binary
        run: cargo build --release

      - name: Stage artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "target/release/${BIN}" "${BIN}-${VERSION}-x86_64-linux"
          chmod +x "${BIN}-${VERSION}-x86_64-linux"

      - uses: actions/upload-artifact@v7
        with:
          path: micromail-*-x86_64-linux
          archive: false
          if-no-files-found: error

  build-windows:
    name: Build x86_64 Windows
    runs-on: windows-latest
    needs: ci
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Sync version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          grep '^version = ' Cargo.toml

      - name: Build release binary
        run: cargo build --release

      - name: Stage artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp "target/release/${BIN}.exe" "${BIN}-${VERSION}-x86_64-windows.exe"

      - uses: actions/upload-artifact@v7
        with:
          path: micromail-*-x86_64-windows.exe
          archive: false
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "micromail-*-x86_64-*"
          merge-multiple: true
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          # Release body comes from the annotated tag message (no GitHub auto notes).
          generate_release_notes: false
          fail_on_unmatched_files: true
